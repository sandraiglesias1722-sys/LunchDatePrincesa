<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Una sorpresa para Andre 💌</title>
<style>
body{margin:0;padding:16px;min-height:100vh;box-sizing:border-box;font-family:system-ui,sans-serif;color:#4a2c2a;background:linear-gradient(135deg,#ffd6e0,#ffe9c7,#e3f0ff,#ffd6e0);background-size:300% 300%;animation:bg 14s ease infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
#fondo{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.flota{position:absolute;bottom:-60px;font-size:28px;opacity:.75;animation:sube linear forwards}
@keyframes sube{to{transform:translateY(-115vh) rotate(360deg)}}
.g{position:relative;z-index:1;max-width:420px;margin:20px auto;padding:24px 18px;background:rgba(255,255,255,.88);border-radius:22px;text-align:center;box-shadow:0 8px 30px rgba(192,57,43,.15)}
h1{font-size:22px;margin:8px 0 12px}
p{font-size:17px;line-height:1.45;margin:8px 0}
.niv{color:#b5651d;font-size:14px;font-weight:bold;letter-spacing:.5px}
.b{display:block;width:100%;margin:10px 0;padding:14px;border:2px solid #e8a87c;background:#fff;border-radius:14px;font-size:17px;color:#4a2c2a;cursor:pointer;box-sizing:border-box}
.p{background:#c0392b;border-color:#c0392b;color:#fff}
.big{font-size:56px}
.ok{color:#2e7d32;font-weight:bold}
.err{color:#c0392b}
.shake{animation:s .4s}
@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#no{width:60%;margin:10px auto;position:relative;transition:all .25s}
#area{position:relative;height:330px;overflow:hidden;background:rgba(255,240,225,.9);border:2px dashed #e8a87c;border-radius:18px;touch-action:none;user-select:none}
#plato{position:absolute;bottom:6px;left:0;width:56px;text-align:center;font-size:46px}
.item{position:absolute;top:0;left:0;font-size:36px}
#pts{font-size:20px;font-weight:bold}
#crepe{width:220px;height:220px;margin:12px auto;box-sizing:border-box;border-radius:50%;background:#f3c77a;border:6px solid #e0a94f;position:relative;overflow:hidden;transition:all .9s}
#crepe.doblado{height:110px;border-radius:110px 110px 0 0}
.ing{position:absolute;font-size:30px}
.ings{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ings .b{margin:0;padding:10px;font-size:15px}
</style>
</head>
<body>
<div id="fondo"></div>
<div class="g" id="app"></div>
<script>
const NUMERO = "573012905950";

const app = document.getElementById("app");
const fondo = document.getElementById("fondo");
const EMOJIS = ["💛","🧇","🥞","🍓","🍦","✨","💕"];

function flotar(lista, dur){
  const s = document.createElement("div");
  s.className = "flota";
  s.textContent = lista[Math.floor(Math.random()*lista.length)];
  s.style.left = Math.random()*100 + "%";
  s.style.animationDuration = (dur || 7 + Math.random()*5) + "s";
  fondo.appendChild(s);
  setTimeout(()=>s.remove(), 13000);
}
setInterval(()=>flotar(EMOJIS), 900);

function lluvia(){
  for(let k=0;k<40;k++){ setTimeout(()=>flotar(["🎉","💛","🥳","💕","🧇","🥞"], 3 + Math.random()*2), k*60); }
}

function inicio(){
  app.innerHTML = `<div class="big">💌</div>
  <h1>Princesa, tengo algo para ti</h1>
  <p>Supera 3 niveles para descubrir tu sorpresa.</p>
  <button class="b p" onclick="atrapa()">Empezar</button>`;
}

function atrapa(){
  app.innerHTML = `<p class="niv">NIVEL 1 DE 3</p>
  <h1>Atrapa los waffles 🧇</h1>
  <p>Mueve el plato con el dedo y atrapa 10 waffles. ¡Cuidado con el brócoli! 🥦</p>
  <div id="area"><div id="plato">🍽️</div></div>
  <p id="pts">0 / 10</p>`;
  const area = document.getElementById("area");
  const plato = document.getElementById("plato");
  const pts = document.getElementById("pts");
  const W = area.clientWidth, H = area.clientHeight;
  let px = W/2, score = 0, items = [], vivo = true, last = 0;

  function mover(e){
    const r = area.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    px = Math.max(28, Math.min(W-28, x));
  }
  area.addEventListener("touchstart", mover, {passive:true});
  area.addEventListener("touchmove", e=>{ e.preventDefault(); mover(e); }, {passive:false});
  area.addEventListener("mousemove", mover);

  function loop(t){
    if(!vivo) return;
    if(t - last > 650){
      last = t;
      const malo = Math.random() < 0.25;
      const el = document.createElement("div");
      el.className = "item";
      el.textContent = malo ? "🥦" : "🧇";
      area.appendChild(el);
      items.push({el, x:20 + Math.random()*(W-40), y:-40, v:2 + Math.random()*2.2, malo});
    }
    plato.style.left = (px - 28) + "px";
    items = items.filter(it=>{
      it.y += it.v;
      it.el.style.transform = `translate(${it.x-18}px,${it.y}px)`;
      if(it.y > H-95 && it.y < H-45 && Math.abs(it.x - px) < 40){
        it.el.remove();
        score = Math.max(0, score + (it.malo ? -1 : 1));
        pts.textContent = (it.malo ? "🥦 ¡Uy! " : "") + score + " / 10";
        if(score >= 10){
          vivo = false;
          pts.textContent = "🎉 ¡Lo lograste!";
          setTimeout(armaCrepe, 1000);
        }
        return false;
      }
      if(it.y > H){ it.el.remove(); return false; }
      return true;
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

const INGS = [["🍓","Fresa"],["🍌","Banano"],["🍫","Nutella"],["🍦","Helado"],["🍯","Arequipe"],["🫐","Arándanos"]];
let elegidos = [];

function armaCrepe(){
  elegidos = [];
  app.innerHTML = `<p class="niv">NIVEL 2 DE 3</p>
  <h1>Arma tu crepe soñado 🥞</h1>
  <p>Toca al menos 3 ingredientes y luego dóblalo.</p>
  <div id="crepe"></div>
  <div class="ings">${INGS.map((g,k)=>`<button class="b" onclick="poner(${k})">${g[0]} ${g[1]}</button>`).join("")}</div>
  <button class="b p" onclick="doblar()">Doblar mi crepe</button>
  <p id="m" class="err"></p>`;
}

function poner(k){
  const c = document.getElementById("crepe");
  if(c.classList.contains("doblado")) return;
  const s = document.createElement("span");
  s.className = "ing";
  s.textContent = INGS[k][0];
  const a = Math.random()*Math.PI*2, r = Math.random()*65;
  s.style.left = (89 + Math.cos(a)*r) + "px";
  s.style.top = (86 + Math.sin(a)*r) + "px";
  c.appendChild(s);
  if(!elegidos.includes(INGS[k][1])) elegidos.push(INGS[k][1]);
  document.getElementById("m").textContent = "";
}

function doblar(){
  const m = document.getElementById("m");
  if(elegidos.length < 3){
    m.className = "err";
    m.textContent = `Te faltan ${3 - elegidos.length} ingrediente(s) 😉`;
    return;
  }
  document.getElementById("crepe").classList.add("doblado");
  m.className = "ok";
  m.textContent = "¡Qué delicia! 😋 Último nivel…";
  setTimeout(()=>{ i = 0; pregunta(""); }, 1800);
}

const preguntas = [
  {q:"Viene justo después del sábado 28 de noviembre. ¿Qué día es?", o:["Viernes 27","Lunes 30","Domingo 29"], a:2, r:"📅"},
  {q:"Me criaron, me consienten y se mueren por almorzar contigo. ¿Quiénes son?", o:["Mis vecinos","Mis papás","Mis compañeros de trabajo"], a:1, r:"👨‍👩‍👧"},
  {q:"¿Dónde venden los crepes y waffles más ricos de Colombia?", o:["Crepes & Waffles","En la luna","En una ferretería"], a:0, r:"🥞"}
];
let i = 0;

function pregunta(msg){
  const p = preguntas[i];
  app.innerHTML = `<p class="niv">NIVEL 3 DE 3 · ACERTIJO ${i+1} DE ${preguntas.length}</p>
  <p class="ok">${msg}</p>
  <p><b>${p.q}</b></p>` +
  p.o.map((o,k)=>`<button class="b" onclick="resp(${k},this)">${o}</button>`).join("") +
  `<p id="m" class="err"></p>`;
}

function resp(k, btn){
  const p = preguntas[i];
  if(k === p.a){
    i++;
    if(i < preguntas.length){ pregunta(p.r + " ¡Correcto!"); } else { final(); }
  } else {
    btn.classList.add("shake");
    document.getElementById("m").textContent = "¡Casi! Intenta otra vez 😉";
    setTimeout(()=>btn.classList.remove("shake"), 400);
  }
}

function final(){
  app.innerHTML = `<div class="big">🥞🧇💛</div>
  <h1>Princesa, ¿quieres almorzar conmigo y con mis papás en Crepes &amp; Waffles el domingo 29 de noviembre?</h1>
  <button class="b p" onclick="si()">¡Sí, acepto! 💛</button>
  <button class="b" id="no" onmouseover="huir()" onclick="huir()">No</button>`;
}

function huir(){
  const n = document.getElementById("no");
  n.style.left = (Math.random()*140 - 70) + "px";
  n.style.top = (Math.random()*50 - 25) + "px";
  const frases = ["¿Segura? 🥺","Piénsalo bien","Ese botón no funciona 😝","Intenta con el otro"];
  n.textContent = frases[Math.floor(Math.random()*frases.length)];
}

function si(){
  lluvia();
  const t = encodeURIComponent(`¡Sí, Sandy! 💛 Acepto almorzar contigo y con tus papás en Crepes & Waffles el domingo 29 de noviembre 🥞🧇 Y mi crepe ideal lleva: ${elegidos.join(", ")} 😋`);
  app.innerHTML = `<div class="big">🎉</div>
  <h1>¡Yupiii!</h1>
  <p>Toca el botón para enviarle tu respuesta a Sandy.</p>
  <a class="b p" style="text-decoration:none" href="https://wa.me/${NUMERO}?text=${t}" target="_blank">Enviar por WhatsApp 💬</a>`;
}

inicio();
</script>
</body>
</html>
